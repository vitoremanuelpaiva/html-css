<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tag em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir.Passe o mouse sobre os termos para decobrir qual tag deverá ultilizar cada caso.</p>
    <ul>
        <li><abbr title="Usa a tag p">Parágrafo</abbr></li>
        <li><abbr title="Usa a tag title">Titulo</abbr></li>
        <li><abbr title="Usa a tag img">Imagens</abbr></li>
        <li><abbr title="Usa a tag ul">Lista não ordenada</abbr></li>
        <li><abbr title="Usa a tag abbr">Abreviações</abbr></li>
        <li><abbr title="Usa a tag em">Itálico</abbr></li>
        <li><abbr title="Usa a tag strong">negrito</abbr></li>
        <li><abbr title="Usa a tag small">Texto pequeno</abbr></li>
    </ul>
</body>
</html>

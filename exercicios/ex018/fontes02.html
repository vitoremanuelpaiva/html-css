<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: "love";
            src: url('Ready\ Lover\ Font\ by\ 7Ntypes.otf') format("opentype");
            font-weight: normal;
            font-style: normal;
        }
        /*Tipos de Format
            -opentype(otf)
            -truetype(ttf)
            -embedded-opentype
            -truetype-aat (Apple Advance Typhografy)
            -SVG
        */    
        body{
            font-family: "love", Helvetica, sans-serif;
        }
        h1{
            font-family: 'love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>fontes Externas</h1>
    <h2>Titulo</h2>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eligendi aliquam reiciendis enim nam ut earum vel, voluptatibus doloribus incidunt deleniti commodi blanditiis iste quis praesentium fuga, animi non iusto iure?</p>
</body>
</html>

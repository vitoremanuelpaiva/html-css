<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho da página do seu computador.</p>
    <picture>
    <!--Como eu já escrevi no caderno essa tag é ultilizada para deixar as imagens responsivas a a tag source é a base disso com o elemento média de você pode definir como largura máxima ou largura minima que a imagem do tamanho correspondente vai aparecer.-->
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png"><!--Nesse exemplo o professor gosta de ultilizar a largura máxima pois para ele é mais pratico,nessa condição a imagem quando passar de 750px irá colocar a imagem pequena que está na pasta imagens em formato pdf.-->
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png"><!--Nesse exempl é o mesmo do registrado acima só aqui quando o temanho da tela for menor que 1050px ira trocar a imagem G para a imagem M do mesmo jeito a imagem M para a imagem P.-->
        <img src="imagens/foto-g.png" alt="imagem grande">
    </picture>
    <h1>Aprendendo a colocar aúdios em HTML</h1>
    <p>Vamos colocar o primeiro aúdio em HTML</p>
    <!--Existe o modelo MP3,OGG,WAV existe também os elementos autoplay que toca a musica assim que ela carregar e a loop que volta o aúdio quando terminar a a tag preload que pode ter os elemntos auto que toca a música assim que todo site carregar pórem não é muito aconselhavel em ultilizar em arquivos muitos grandes o metadata carrega as informações que só toca o aúdio quando ele carregar completamente e o none que só toca quando a pessoa apertar.-->
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
